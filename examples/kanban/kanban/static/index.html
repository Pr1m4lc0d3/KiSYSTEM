<!DOCTYPE html>
<!--
  index.html — the board page shell.
  One responsibility: structure. It declares the add-card form and an empty board
  container, then hands all behaviour to app.js and all looks to style.css.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kanban</h1>
      <!-- Add a card: a required title and an optional label. -->
      <form id="add-form" class="add-form">
        <input name="title" type="text" placeholder="Card title" autocomplete="off" required />
        <input name="label" type="text" placeholder="Label (optional)" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
    </header>

    <!-- app.js fills this with one column section per board column. -->
    <main id="board" class="board"></main>

    <!-- Deleted-card history. app.js fills this from the same board data,
         so it needs no extra request and updates after every delete. -->
    <section id="archive" class="archive"></section>

    <script src="app.js"></script>
  </body>
</html>
